<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Solid accent-red block, thick black border, no rounding: brutalist "badge" style -->
  <rect x="3" y="3" width="58" height="58" fill="#f2ead9" stroke="#171412" stroke-width="5"/>

  <!-- GN monogram, bold black, centered -->
  <text
    x="32"
    y="43"
    font-family="Arial, Helvetica, sans-serif"
    font-weight="900"
    font-size="26"
    text-anchor="middle"
    letter-spacing="-1"
  ><tspan fill="#171412">G</tspan><tspan fill="#d32f2f">N</tspan></text>
</svg>
